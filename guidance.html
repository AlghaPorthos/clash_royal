<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How to Play · Clash Royal Fairy Tail 游戏指南</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#e8eef7;
    background:
      radial-gradient(1000px 560px at 50% -8%,#2c4d94 0%,transparent 55%),
      radial-gradient(800px 500px at 8% 30%,#3a2c66 0%,transparent 50%),
      #0b1220;
    min-height:100vh;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  #gfx{position:fixed;inset:0;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 16px 80px}

  .bar{display:flex;align-items:center;gap:10px;padding:18px 2px;flex-wrap:wrap}
  .bar h1{flex:1;min-width:200px;font-size:clamp(19px,4vw,26px);letter-spacing:1px;
    background:linear-gradient(90deg,#fff3c0,#ffd700,#ff9838);-webkit-background-clip:text;background-clip:text;color:transparent}
  .bbtn{padding:11px 22px;font-size:14px;font-weight:bold;font-family:inherit;border-radius:30px;cursor:pointer;
    border:1.5px solid #2c4a78;background:#101c30ee;color:#e8eef7;transition:all .15s;backdrop-filter:blur(4px)}
  .bbtn:hover{transform:translateY(-2px);border-color:#ffd700;box-shadow:0 8px 22px #0008}
  .bbtn.gold{background:linear-gradient(135deg,#ffe07a,#ff9838);color:#241300;border:none;box-shadow:0 8px 24px #ff983855}

  /* hero — guild poster strip with facing medallions */
  .hero{position:relative;display:flex;align-items:center;justify-content:center;
    border:1px solid #2c4a78;border-radius:20px;overflow:hidden;margin:6px 0 26px;min-height:280px;
    background:center 22%/cover no-repeat}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(8,12,26,.45),rgba(8,12,26,.15) 40%,rgba(8,12,26,.78)),
      radial-gradient(600px 300px at 50% 45%,transparent 40%,rgba(8,12,26,.5))}
  .hmed{position:relative;z-index:2;width:min(120px,17vw);height:min(120px,17vw);border-radius:50%;
    border:3px solid #ffffff55;overflow:hidden;box-shadow:0 10px 30px #000b,0 0 22px #4a7dd866;
    animation:floaty 4.6s ease-in-out infinite}
  .hmed img{width:100%;height:100%;object-fit:cover}
  .hmed.left{margin-right:min(30px,6vw)}
  .hmed.right{margin-left:min(30px,6vw);animation-delay:-2.3s}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .hcenter{position:relative;z-index:2;text-align:center;padding:34px 10px;max-width:420px}
  .hcenter .k{font-size:11px;letter-spacing:5px;color:#ffe9b8;font-weight:bold;text-shadow:0 0 14px #ff9838}
  .hcenter h2{font-size:clamp(25px,5vw,38px);font-weight:900;letter-spacing:2px;margin:8px 0;
    background:linear-gradient(180deg,#fff8dc,#ffd700 55%,#ff9838);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 18px #000a)}
  .hcenter p{color:#f0e8d6;font-size:13.5px;text-shadow:0 2px 8px #000b}

  .gsec{background:#0d1729ee;border:1px solid #24406a;border-left:3px solid #ffd700;border-radius:12px;
    padding:16px 18px;margin-bottom:12px;backdrop-filter:blur(3px)}
  .gsec h3{margin:0 0 8px;font-size:16px;color:#ffe9a0}
  .gsec p{margin:0 0 8px;font-size:14px;line-height:1.8;color:#c6d5ec}
  .gsec ul{margin:0;padding-left:20px}
  .gsec li{font-size:14px;line-height:1.85;color:#c6d5ec}
  .gdeck{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px;margin-top:10px}
  .gcard{position:relative;background:#152342;border:1px solid #2c4a78;border-radius:10px;padding:18px 6px 9px;
    text-align:center;transition:transform .12s,border-color .12s}
  .gcard:hover{transform:translateY(-3px);border-color:#ffd700}
  .gcard img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid #ffffff2e}
  .gcard b{display:block;font-size:12px;margin-top:4px;color:#eaf2ff}
  .gcard i{display:block;font-style:normal;font-size:10.5px;color:#9fd8ff;margin-top:2px}
  .gcard small{display:block;font-size:10px;color:#8ba0c6;margin-top:2px}
  .gcost{position:absolute;top:4px;left:7px;font-size:11px;color:#d98af5;font-weight:bold}

  .cta{text-align:center;padding:34px 0 6px}
  .cta .big{display:inline-block;padding:16px 56px;font-size:19px;font-weight:bold;font-family:inherit;
    border-radius:42px;cursor:pointer;letter-spacing:2px;border:none;
    background:linear-gradient(135deg,#ffe07a,#ff9838 60%,#ff7a3d);color:#241300;
    box-shadow:0 10px 34px #ff983877,0 0 0 3px #ffffff2e,inset 0 2px 0 #fff8;transition:transform .16s,box-shadow .16s}
  .cta .big:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 16px 44px #ff9838aa}
</style>
</head>
<body>
<canvas id="gfx"></canvas>
<div class="wrap">
  <div class="bar">
    <button class="bbtn" onclick="location.href='index.html'" data-i18n="backHome">← HOME</button>
    <h1 data-i18n="gTitle">How to Play</h1>
    <button class="bbtn" id="btnFeedback">💬 <span data-i18n="feedbackBtn">FEEDBACK</span></button>
    <button class="bbtn" id="btnLang">🌐 <span id="langLabel">中文</span></button>
  </div>

  <div class="hero">
    <div class="hmed left"><img src="assets/p_juvia.png" alt="Juvia"></div>
    <div class="hcenter">
      <div class="k" data-i18n="kicker">FAIRY TAIL EDITION</div>
      <h2 data-i18n="gTitle">How to Play</h2>
      <p data-i18n="gSub">Everything a new mage needs before the first duel</p>
    </div>
    <div class="hmed right"><img src="assets/p_gray.png" alt="Gray"></div>
  </div>

  <div id="content"></div>

  <div class="cta">
    <button class="big" onclick="location.href='game.html'">⚔️ <span data-i18n="battleNow">START BATTLE</span></button>
  </div>
</div>

<script src="js/i18n.js?v=3"></script>
<script src="js/assets.js?v=3"></script>
<script src="js/chars.js?v=3"></script>
<script src="js/guidance.js?v=3"></script>
<script src="js/feedback.js?v=3"></script>
<script>
(function(){
 const BG='assets/poster_guild.jpg';
 document.querySelector('.hero').style.backgroundImage='url("'+((window.ASSETS&&ASSETS[BG])||BG)+'")';
 document.querySelectorAll('.hmed img').forEach(function(im){
  const k=im.getAttribute('src');
  if(window.ASSETS&&ASSETS[k])im.src=ASSETS[k];
 });
})();
</script>
<script>
/* floating particles */
(function(){
 const fx=document.getElementById('gfx'),fg=fx.getContext('2d');
 let motes=[];
 function size(){fx.width=innerWidth;fx.height=innerHeight;
  motes=[];for(let i=0;i<40;i++)motes.push({x:Math.random()*fx.width,y:Math.random()*fx.height,
   r:.8+Math.random()*2.2,vy:-.18-Math.random()*.5,vx:(Math.random()-.5)*.3,
   c:Math.random()<.5?'rgba(160,200,255,':'rgba(255,214,140,',a:.15+Math.random()*.4,ph:Math.random()*7});}
 size();addEventListener('resize',size);
 (function loop(){
  fg.clearRect(0,0,fx.width,fx.height);
  motes.forEach(m=>{
   m.y+=m.vy;m.x+=m.vx+Math.sin(performance.now()/1000+m.ph)*.3;
   if(m.y<-6){m.y=fx.height+6;m.x=Math.random()*fx.width;}
   fg.fillStyle=m.c+(m.a*(0.55+0.45*Math.sin(performance.now()/520+m.ph)))+')';
   fg.beginPath();fg.arc(m.x,m.y,m.r,0,7);fg.fill();
  });
  requestAnimationFrame(loop);
 })();
})();
function render(){document.getElementById('content').innerHTML=CRGUID.build();}
document.getElementById('btnLang').onclick=()=>CRI18N.toggle();
function refreshLangUI(){
 document.getElementById('langLabel').textContent=CRI18N.lang()==='en'?'中文':'English';
 render();
 document.title=CRI18N.lang()==='zh'?'游戏指南 · 皇室战争妖精的尾巴版':'How to Play · Clash Royal Fairy Tail';
}
addEventListener('crlang',refreshLangUI);
CRI18N.apply();
refreshLangUI();
</script>
</body>
</html>
