<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Clash Royal · Fairy Tail Arena 妖精的尾巴竞技场</title>
<style>
  :root{
    --panel:#101c30;--line:#2c4a78;--ink:#e8eef7;--dim:#9fb4d8;
    --gold:#ffd700;--gold2:#ff9838;--violet:#b05dd8;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:
      radial-gradient(1100px 520px at 50% -8%,#22375f 0%,transparent 60%),
      #0a0f1c;
    display:flex;flex-direction:column;align-items:center;
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);user-select:none;touch-action:manipulation;height:100dvh;overflow:hidden}

  /* ===== HUD ===== */
  #hud{width:100%;max-width:980px;padding:6px 10px 4px;display:flex;flex-direction:column;gap:4px}
  #hbar{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
  #hTitle{flex:1;min-width:0;font-size:14px;font-weight:900;letter-spacing:.5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
    background:linear-gradient(90deg,#ffe9a0,#ffd700,#ff9838);-webkit-background-clip:text;background-clip:text;color:transparent}
  #clock{display:flex;align-items:center;gap:10px;padding:5px 14px;border-radius:20px;background:#0d1830e6;
    border:1px solid var(--line);font-size:14px;font-weight:700}
  #clock b{color:var(--gold);font-variant-numeric:tabular-nums}
  #clock .cr{font-size:12px;color:var(--dim)}
  #clock .cr b{color:#fff}
  #dexl{color:#e080ff;font-weight:700;font-size:12px}
  .hbtn{padding:6px 12px;font-size:12.5px;font-weight:bold;font-family:inherit;border-radius:18px;cursor:pointer;
    border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
    transition:transform .12s,border-color .12s,box-shadow .12s;white-space:nowrap}
  .hbtn:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 6px 16px #0008}
  .hbtn.guide{color:#ffe9a0;border-color:#3d5a86}
  .hbtn.home{color:#ffe9a0;border-color:#8a6d2b;background:linear-gradient(160deg,#1c2740,#101a2e);
    box-shadow:0 0 10px #ffd70022}
  .hbtn.home:hover{border-color:var(--gold);box-shadow:0 6px 16px #0008,0 0 16px #ffd70044}
  .hbtn.home:active{transform:translateY(1px) scale(.96)}

  /* ===== battlefield ===== */
  #cvwrap{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;
    padding:2px 6px}
  #cv{border-radius:12px;box-shadow:0 18px 50px #000a,0 0 0 3px #1d3252,0 0 30px #2a4a8a55;
    touch-action:none;cursor:pointer}
  #msg{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;
    padding:6px 18px;border-radius:20px;background:#0a1424d9;border:1px solid #ffffff26;
    font-size:13px;font-weight:700;color:var(--gold);backdrop-filter:blur(4px);
    box-shadow:0 6px 18px #0008;white-space:nowrap;pointer-events:none;transition:opacity .3s}

  /* ===== end-of-battle panel ===== */
  #endscr{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;pointer-events:none}
  #endscr.show{display:flex}
  #endscr .panel{pointer-events:auto;text-align:center;padding:26px 34px 20px;border-radius:20px;
    background:linear-gradient(170deg,#101c30e8,#0a1424f0);border:1px solid #3d5a86;
    box-shadow:0 24px 70px #000d,0 0 36px #2a4a8a55;backdrop-filter:blur(6px);
    animation:endIn .4s cubic-bezier(.2,1.4,.4,1)}
  @keyframes endIn{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
  #endscr .et{font-size:clamp(26px,5vw,34px);font-weight:900;letter-spacing:2px;
    text-shadow:0 4px 18px #000a}
  #endscr .et.win{background:linear-gradient(180deg,#fff3c0,#ffd700 55%,#ff9838);
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px #ffd70066)}
  #endscr .et.lose{color:#ff9a8a;text-shadow:0 0 18px #c0392c88}
  #endscr .et.draw{color:#c6d5ec}
  #endscr .es{margin:8px 0 18px;font-size:15px;font-weight:700;color:#e8eef7;letter-spacing:1px}
  #endscr .erow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .ebtn{padding:12px 26px;font-size:14.5px;font-weight:900;font-family:inherit;border-radius:34px;cursor:pointer;
    letter-spacing:1.5px;border:none;transition:transform .14s,box-shadow .14s,filter .14s}
  .ebtn:active{transform:translateY(1px) scale(.96)}
  .ebtn.gold{background:linear-gradient(135deg,#ffe07a,#ff9838 60%,#ff7a3d);color:#241300;
    box-shadow:0 8px 26px #ff983877,0 0 0 2px #ffffff2e,inset 0 2px 0 #fff8;
    animation:goldPulse 2.4s ease-in-out infinite}
  @keyframes goldPulse{0%,100%{box-shadow:0 8px 26px #ff983866,0 0 0 2px #ffffff2e}
    50%{box-shadow:0 8px 34px #ff9838aa,0 0 20px #ffd70055,0 0 0 2px #ffffff2e}}
  .ebtn.gold:hover{transform:translateY(-3px) scale(1.04)}
  .ebtn.dark{background:#0f1a2e;color:#e8eef7;border:2px solid #3d5a86}
  .ebtn.dark:hover{transform:translateY(-3px);border-color:#ffd700;box-shadow:0 8px 22px #0008}
  .ebtn.soft{background:#0f1a2ecc;color:#ffe9a0;border:1.5px solid #3d5a86;font-size:15px;padding:12px 16px}
  .ebtn.soft:hover{transform:translateY(-3px);border-color:#ffd700}
  #endscr .ehint{margin-top:14px;font-size:11.5px;color:#7d92b8}

  /* ===== bottom dock: hand + elixir ===== */
  #dock{width:100%;max-width:980px;padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px;align-items:center}
  #hand{display:flex;gap:8px;justify-content:center;align-items:flex-end}
  #next{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;
    font-size:9.5px;color:var(--dim);letter-spacing:1px;padding-bottom:4px}
  #next .ic{width:40px;height:40px;border-radius:10px;border:1.5px dashed #3d5a86;opacity:.9;object-fit:cover}
  .card{width:76px;height:100px;background:linear-gradient(165deg,#1c2f52,#0e1930);
    border:2px solid #3d5a86;border-radius:12px;text-align:center;cursor:pointer;font-size:10.5px;
    position:relative;transition:transform .12s,border-color .12s,box-shadow .12s;overflow:hidden;
    box-shadow:0 8px 18px #0008}
  .card:hover{transform:translateY(-4px);border-color:#7fb2ff}
  .card.sel{transform:translateY(-10px);border-color:var(--gold);box-shadow:0 0 20px #ffd700bb}
  .card .art{width:56px;height:56px;margin:7px auto 0;border-radius:50%;object-fit:cover;display:block;
    border:2px solid #ffffff2e;box-shadow:0 3px 10px #0008}
  .card .nm{margin-top:3px;font-weight:bold;color:#eaf2ff;line-height:1.1;padding:0 3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .cost{position:absolute;top:-7px;left:-7px;background:radial-gradient(circle at 35% 30%,#d98af5,#9a3ec4);
    border-radius:50%;width:23px;height:23px;line-height:21px;font-weight:bold;border:2px solid #fff;font-size:11px;
    box-shadow:0 2px 8px #0008;z-index:2}
  .card .pb{position:absolute;bottom:0;left:0;right:0;height:5px;background:#000a;border-radius:0 0 9px 9px;overflow:hidden}
  .card .pb i{display:block;height:100%;background:linear-gradient(90deg,#8fd0f0,#5fb8f0);box-shadow:0 0 8px #7fd0ff}
  /* elixir bar */
  #exbar{width:min(520px,94vw);height:18px;border-radius:10px;background:#0b1424;position:relative;
    border:1px solid #2c4a78;box-shadow:inset 0 2px 6px #000a,0 4px 12px #0006;overflow:hidden}
  #exfill{position:absolute;inset:2px;width:30%;border-radius:8px;
    background:linear-gradient(90deg,#8a3ec4,#c86ae8,#e8a8ff);
    box-shadow:0 0 12px #c86ae8aa;transition:width .25s linear}
  #exseg{position:absolute;inset:0;display:flex}
  #exseg i{flex:1;border-right:1px solid #ffffff1c}
  #exnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000;letter-spacing:1px}

  /* ===== tooltip ===== */
  #tip{position:fixed;display:none;z-index:30;pointer-events:none;background:#0e1a2ef2;
    border:1px solid #3d6a9a;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.7;min-width:180px;
    backdrop-filter:blur(6px);box-shadow:0 10px 30px #000b}
  #tip .th{font-size:14px;font-weight:bold;color:var(--gold);margin-bottom:2px}
  #tip .ts{font-size:11px;color:#9fd8ff;font-style:italic;margin-bottom:6px}
  #tip .tr{display:flex;justify-content:space-between;gap:16px}
  #tip .tr b{color:#9cf;font-weight:normal}
  #tip .sp{color:#fd8;margin-top:5px}

  /* ===== LOADING — dramatic cinematic poster ===== */
  #loading{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
    overflow:hidden;transition:opacity .55s ease;background:#060a14}
  #loading.done{opacity:0;pointer-events:none}
  #ldBg{position:absolute;inset:-3%;background:center top/cover no-repeat;
    filter:brightness(.96) saturate(1.1);animation:ldZoom 9s ease-in-out infinite alternate}
  @keyframes ldZoom{from{transform:scale(1)}to{transform:scale(1.07)}}
  #ldVeil{position:absolute;inset:0;
    background:
      radial-gradient(1000px 640px at 50% 34%,transparent 24%,rgba(4,8,18,.72) 100%),
      linear-gradient(180deg,rgba(5,9,20,.55) 0%,transparent 26%,transparent 40%,#050912f2 88%)}
  #ldFlash{position:absolute;inset:0;mix-blend-mode:screen;opacity:.5;pointer-events:none;
    background:radial-gradient(700px 300px at 50% 34%,rgba(140,170,255,.13),transparent 70%);
    animation:ldGlow 2.4s ease-in-out infinite}
  @keyframes ldGlow{0%,100%{opacity:.3}50%{opacity:.65}}
  #ldCol{position:relative;z-index:2;width:min(560px,92vw);padding:0 14px 7vh;text-align:center}
  #ldKick{font-size:11px;letter-spacing:6px;color:#aac4ff;font-weight:800;text-shadow:0 0 14px #4a6add}
  #ldLogo{font-size:clamp(30px,6vw,50px);font-weight:900;letter-spacing:4px;margin:4px 0 18px;
    background:linear-gradient(90deg,#eaf2ff,#ffe9a0 55%,#ff9838);-webkit-background-clip:text;background-clip:text;
    color:transparent;filter:drop-shadow(0 4px 18px #ff983855)}
  #ldTip{display:flex;gap:12px;align-items:center;text-align:left;background:#0a1220d9;
    border:1px solid #3d5a86;border-radius:14px;padding:12px 16px;backdrop-filter:blur(6px);
    transition:opacity .3s;margin-bottom:16px;box-shadow:0 10px 30px #000a}
  #ldTip.fade{opacity:0}
  #ldTipK{font-size:10px;letter-spacing:3px;color:#ffd700;font-weight:900;margin-bottom:3px}
  #ldTipText{font-size:14px;line-height:1.5;color:#eaf2ff}
  #ldTipIcon{font-size:26px;filter:drop-shadow(0 0 10px #ffd70066)}
  #ldBar{height:5px;border-radius:4px;background:#ffffff1f;overflow:hidden}
  #ldFill{display:block;height:100%;width:0%;border-radius:4px;
    background:linear-gradient(90deg,#5f8fff,#9fd0ff 60%,#ffe9a0);box-shadow:0 0 12px #7fa8ff}
  #ldRow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  #ldPct{font-size:10.5px;letter-spacing:2px;color:#8095bb}
  #ldSkip{padding:5px 16px;font-size:11px;letter-spacing:2px;font-family:inherit;font-weight:bold;
    border-radius:16px;border:1px solid #3d5a86;background:#0f1a2ecc;color:#9fb4d8;cursor:pointer;transition:all .15s}
  #ldSkip:hover{color:#fff;border-color:var(--gold)}

  /* ===== guidance modal ===== */
  #gmodal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:#05080fd9;backdrop-filter:blur(6px);padding:12px}
  #gmodal.open{display:flex}
  #gpanel{width:min(780px,96vw);max-height:88vh;display:flex;flex-direction:column;
    background:linear-gradient(165deg,#132039,#0a1220);border:1px solid #3d5a86;border-radius:18px;
    box-shadow:0 30px 80px #000d,0 0 40px #2a4a8a44;overflow:hidden}
  #ghead{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
  #ghead h2{flex:1;margin:0;font-size:18px;color:var(--gold);letter-spacing:1px}
  #gNote{font-size:11.5px;color:#7d92b8}
  #gclose{padding:8px 18px;font-size:12.5px;font-weight:bold;font-family:inherit;border-radius:18px;cursor:pointer;
    border:none;background:linear-gradient(135deg,#ffd700,#ff9838);color:#1a1200;box-shadow:0 6px 18px #ff983855}
  #gbody{overflow-y:auto;padding:16px 18px 22px}
  .gsec{background:#0d1729;border:1px solid #24406a;border-left:3px solid var(--gold);border-radius:12px;
    padding:14px 16px;margin-bottom:12px}
  .gsec h3{margin:0 0 8px;font-size:15px;color:#ffe9a0}
  .gsec p{margin:0 0 8px;font-size:13.5px;line-height:1.75;color:#c6d5ec}
  .gsec ul{margin:0;padding-left:20px}
  .gsec li{font-size:13.5px;line-height:1.8;color:#c6d5ec}
  .gdeck{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
  .gcard{position:relative;background:#152342;border:1px solid #2c4a78;border-radius:10px;padding:18px 6px 8px;
    text-align:center;transition:transform .12s,border-color .12s}
  .gcard:hover{transform:translateY(-3px);border-color:var(--gold)}
  .gcard img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid #ffffff2e}
  .gcard b{display:block;font-size:11.5px;margin-top:4px;color:#eaf2ff}
  .gcard i{display:block;font-style:normal;font-size:10px;color:#9fd8ff;margin-top:2px}
  .gcard small{display:block;font-size:10px;color:#8ba0c6;margin-top:2px}
  .gcost{position:absolute;top:4px;left:7px;font-size:10.5px;color:#d98af5;font-weight:bold}

  @media (max-width:600px){
    #hTitle{display:none}
    .hbtn .ttx{display:none}
    .card{width:64px;height:88px}
    .card .art{width:46px;height:46px}
    #clock{font-size:12.5px;padding:4px 10px;gap:7px}
    #msg{font-size:11.5px}
    #endscr .panel{padding:20px 16px 14px}
    .ebtn{padding:10px 18px;font-size:13px}
  }
</style>
</head>
<body>

<!-- ===== LOADING — dramatic poster ===== -->
<div id="loading">
  <div id="ldBg"></div><div id="ldVeil"></div><div id="ldFlash"></div>
  <div id="ldCol">
    <div id="ldKick" data-i18n="kicker">FAIRY TAIL EDITION</div>
    <div id="ldLogo">CLASH ROYAL</div>
    <div id="ldTip"><span id="ldTipIcon">🎴</span><span><div id="ldTipK">TIP</div><span id="ldTipText"></span></span></div>
    <div id="ldBar"><i id="ldFill"></i></div>
    <div id="ldRow"><span id="ldPct">0%</span><button id="ldSkip" data-i18n="tapSkip">SKIP</button></div>
  </div>
</div>

<!-- ===== HUD ===== -->
<div id="hud">
  <div id="hbar">
    <span id="hTitle" data-i18n="gameTitle">Clash Royal · Fairy Tail Arena</span>
    <div id="clock">
      <span>⏱ <b id="timer">3:00</b></span>
      <span class="cr">👑 <span data-i18n="you">YOU</span> <b id="cp">0</b></span>
      <span class="cr"><span data-i18n="ai">AI</span> <b id="ce">0</b></span>
      <span id="dexl"></span>
    </div>
    <button class="hbtn home" id="btnHome" title="Home">🏠 <span class="ttx" data-i18n="homeBtn">HOME</span></button>
    <button class="hbtn" id="btnTheme"><span id="themeIco">☀️</span> <span class="ttx" data-i18n="changeBf">BATTLEFIELD</span></button>
    <button class="hbtn" id="btnFeedback" title="Feedback">💬 <span class="ttx" data-i18n="feedbackBtn">FEEDBACK</span></button>
    <button class="hbtn" id="btnLang">🌐 <span id="langLabel">中文</span></button>
    <button class="hbtn guide" id="btnGuide">❓ <span class="ttx" data-i18n="guidanceBtn">Guidance</span></button>
  </div>
</div>

<!-- ===== battlefield ===== -->
<div id="cvwrap">
  <canvas id="cv" width="480" height="800"></canvas>
  <div id="msg" data-i18n="hint">Tap a card, then tap your half to deploy!</div>

  <!-- end-of-battle panel: RESTART / HOME / GUIDANCE -->
  <div id="endscr">
    <div class="panel">
      <div class="et win" id="endTitle">🎉 VICTORY!</div>
      <div class="es" id="endScore">👑 0 — 0</div>
      <div class="erow">
        <button class="ebtn gold" id="endRestart">RESTART</button>
        <button class="ebtn dark" id="endHome">HOME</button>
        <button class="ebtn soft" id="endGuide">❓</button>
      </div>
      <div class="ehint" id="endHint">Tap the arena for another round</div>
    </div>
  </div>
</div>

<!-- ===== dock ===== -->
<div id="dock">
  <div id="hand"></div>
  <div id="exbar"><div id="exfill"></div><div id="exseg"></div><div id="exnum">💧 5/10</div></div>
</div>

<div id="tip"></div>

<!-- ===== guidance modal ===== -->
<div id="gmodal">
  <div id="gpanel">
    <div id="ghead">
      <h2 data-i18n="gTitle">How to Play</h2>
      <span id="gNote" data-i18n="pausedNote">Battle paused while you read</span>
      <button id="gclose" data-i18n="closeBtn">CLOSE</button>
    </div>
    <div id="gbody"></div>
  </div>
</div>

<script src="js/i18n.js?v=3"></script>
<script src="js/assets.js?v=3"></script>
<script src="js/chars.js?v=3"></script>
<script src="js/guidance.js?v=3"></script>
<script src="js/themes.js?v=3"></script>
<script src="js/feedback.js?v=3"></script>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=480,H=800,RIVER_Y=H/2,RIVER_H=44,LX=[W*0.22,W*0.78];
const FT=CRCHARS.FT,T=k=>CRI18N.t(k);
/* ===== 卡牌定义(固定8张)— mechanics identical to the original ===== */
const CARDS={
 knight:{cost:3,hp:600,dmg:75,rng:30,spd:45,hit:1.2,type:'ground'},
 archers:{cost:3,hp:125,dmg:40,rng:120,spd:40,hit:1.2,type:'ground',n:2},
 giant:{cost:5,hp:1800,dmg:110,rng:34,spd:30,hit:1.5,type:'ground',onlyTowers:true},
 minipekka:{cost:4,hp:550,dmg:290,rng:30,spd:60,hit:1.8,type:'ground'},
 musketeer:{cost:4,hp:300,dmg:80,rng:150,spd:40,hit:1.1,type:'ground'},
 skeletons:{cost:2,hp:60,dmg:55,rng:26,spd:60,hit:1.0,type:'ground',n:3},
 cannon:{cost:3,hp:380,dmg:80,rng:140,spd:0,hit:1.4,type:'building',life:25},
 fireball:{cost:4,hp:1,dmg:300,radius:85,type:'spell'}
};
const DECK=['knight','archers','giant','minipekka','musketeer','skeletons','cannon','fireball'];
/* ===== 状态 ===== */
let units=[],shots=[],fx=[];
let elix={p:5,e:5},crowns={p:0,e:0},timer=180,over=false,started=false,winner='';
let hand={p:[],e:[]},queue={p:[],e:[]},selCard=null;
let towers=[];
let paused=false,shakeT=0,shakeMag=0;
function newTower(side,x,y,king){return{isTower:true,side,x,y,king,hp:king?1600:900,maxHp:king?1600:900,dmg:king?80:55,rng:king?150:135,hit:1,cd:0,r:king?34:26};}
function reset(){
 units=[];shots=[];fx=[];elix={p:5,e:5};crowns={p:0,e:0};timer=180;over=false;winner='';selCard=null;
 towers=[
  newTower('e',W/2,64,true), newTower('e',LX[0],150), newTower('e',LX[1],150),
  newTower('p',W/2,H-64,true), newTower('p',LX[0],H-150), newTower('p',LX[1],H-150)
 ];
 for(const s of ['p','e']){const d=shuffle([...DECK]);hand[s]=d.slice(0,4);queue[s]=d.slice(4);}
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ============================================================
 * TERRAIN — pre-rendered offscreen canvas, rebuilt per theme
 * ============================================================ */
const bg=document.createElement('canvas');bg.width=W*2;bg.height=H*2;
const bctx=bg.getContext('2d');
let theme=CRTHEMES.get(),ambient=CRTHEMES.makeAmbient(theme),themeFade=1;
function buildTerrain(){
 bg.width=W*2; // reset transform + clear
 CRTHEMES.drawTerrain(bctx,theme,2);
 vignette=null;
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

function aiThink(dt){
 aiCd-=dt;if(aiCd>0||over)return;
 aiCd=1.2+Math.random();
 const eUnits=units.filter(u=>u.side==='e'),pUnits=units.filter(u=>u.side==='p');

  if(best&&bn>=3&&elix.e>=d.cost){elix.e-=d.cost;deploy('e',k,best.x,best.y);return;}
  return;
 }
 if(threat.length&&d.type!=='building'){
  const t=threat[0];elix.e-=d.cost;deploy('e',k,W/2+(t.x-W/2)*0.6,t.y-80);return;
 }
 if(d.type==='building'){
  elix.e-=d.cost;deploy('e',k,W/2+(Math.random()<.5?-1:1)*40,H/2-130);return;
 }
 const lane=LX[Math.floor(Math.random()*2)];

/* ===== 逻辑(core unchanged; paused guard + fx decay kept) ===== */
function liveTowers(side){return towers.filter(t=>t.side===side&&t.hp>0);}
function nearestStruct(u){
 let best=null,bd=1e9;
 for(const t of liveTowers(u.side==='p'?'e':'p')){const d=Math.hypot(t.x-u.x,t.y-u.y);if(d<bd){bd=d;best=t;}}
 for(const b of units){if(b.side!==u.side&&b.hp>0&&CARDS[b.k].type==='building'){const d=Math.hypot(b.x-u.x,b.y-u.y);if(d<bd){bd=d;best=b;}}}
 return best;
}
function findTarget(u){
 if(CARDS[u.k].onlyTowers)return nearestStruct(u);
 const enemies=units.filter(q=>q.side!==u.side&&q.hp>0&&CARDS[q.k].type!=='building');
 let best=null,bd=170;for(const q of enemies){const d=Math.hypot(q.x-u.x,q.y-u.y);if(d<bd){bd=d;best=q;}}
 return best||nearestStruct(u);
}
function moveToward(u,tx,ty,spd,dt){
 const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy)||1;
 u.x+=dx/d*spd*dt;u.y+=dy/d*spd*dt;
}
function inRiver(u){return Math.abs(u.y-RIVER_Y)<RIVER_H/2&&Math.abs(u.x-LX[0])>34&&Math.abs(u.x-LX[1])>34;}
function update(dt){
 if(!started||over||paused)return;
 const rate=timer<=60?2:1;
 elix.p=Math.min(10,elix.p+dt/2.8*rate);
 elix.e=Math.min(10,elix.e+dt/2.8*rate);
 timer-=dt;if(timer<=0){endGame();return;}
 aiThink(dt);
 for(let i=units.length-1;i>=0;i--){const u=units[i],d=CARDS[u.k];
  u.born+=dt;u.cd-=dt;if(u.atk>0)u.atk-=dt;if(u.flash>0)u.flash-=dt;
  if(d.type==='building'){u.life-=dt;u.hp=Math.min(u.hp,d.hp*u.life/d.life);if(u.life<=0){units.splice(i,1);continue;}}
  if(u.hp<=0){units.splice(i,1);continue;}
  const tgt=findTarget(u);if(!tgt)continue;
  const tr=tgt.r||14,dist=Math.hypot(tgt.x-u.x,tgt.y-u.y)-tr-14;
  if(dist<=d.rng){
   if(u.cd<=0){u.cd=d.hit;
    if(d.rng>50){
     const kind=u.k==='cannon'?'ball':u.k==='musketeer'?'bullet':'arrow';
     shots.push({kind,x:u.x,y:u.y-14,tx:tgt.x,ty:tgt.y,tgt,side:u.side,dmg:d.dmg,spd:kind==='ball'?300:460});
    }else{
     const dd=Math.hypot(tgt.x-u.x,tgt.y-u.y)||1;
     u.atk=.22;u.atkDx=(tgt.x-u.x)/dd;u.atkDy=(tgt.y-u.y)/dd;
     hit(tgt,d.dmg);
     fx.push({slash:.18,x:tgt.x,y:tgt.y,a:Math.atan2(tgt.y-u.y,tgt.x-u.x),c:u.side==='p'?'#cfe8ff':'#ffd0d0'});
    }
   }
  }else if(d.spd>0){
   const needsBridge=u.side==='p'?u.y>RIVER_Y-RIVER_H/2:u.y<RIVER_Y+RIVER_H/2;
   if(needsBridge){
    const bx=LX[Math.abs(u.x-LX[0])<Math.abs(u.x-LX[1])?0:1];
    const bankY=u.side==='p'?RIVER_Y+RIVER_H:RIVER_Y-RIVER_H;
    if(Math.abs(u.x-bx)>14)moveToward(u,bx,bankY,d.spd,dt);
    else moveToward(u,bx,u.side==='p'?RIVER_Y-RIVER_H:RIVER_Y+RIVER_H,d.spd,dt);
   }else moveToward(u,tgt.x,tgt.y,d.spd,dt);
  }
 }
 for(const t of towers){if(t.hp<=0)continue;t.cd-=dt;if(t.flash>0)t.flash-=dt;
  if(t.cd<=0){let best=null,bd=t.rng;for(const u of units){if(u.side===t.side||u.hp<=0)continue;const dd=Math.hypot(u.x-t.x,u.y-t.y);if(dd<bd){bd=dd;best=u;}}
   if(best){t.cd=t.hit;shots.push({kind:'arrow',x:t.x,y:t.y,tx:best.x,ty:best.y,tgt:best,side:t.side,dmg:t.dmg,spd:460});}}
 }
 for(let i=shots.length-1;i>=0;i--){const s=shots[i];
  if(s.spell){
   const dx=s.tx-s.x,dy=s.ty-s.y,dd=Math.hypot(dx,dy);
   if(Math.random()<.8)fx.push({x:s.x+(Math.random()-.5)*10,y:s.y+(Math.random()-.5)*10,t:.3,c:Math.random()<.5?'#fa0':'#f55'});
   if(dd<12){boom(s.tx,s.ty,s.radius,s.side,s.dmg);shots.splice(i,1);continue;}
   s.x+=dx/dd*s.spd*dt;s.y+=dy/dd*s.spd*dt;
  }else{
   if(s.tgt&&s.tgt.hp<=0){shots.splice(i,1);continue;}
   const dx=(s.tgt?s.tgt.x:s.tx)-s.x,dy=(s.tgt?s.tgt.y:s.ty)-s.y,dd=Math.hypot(dx,dy);
   if(dd<14){if(s.tgt)hit(s.tgt,s.dmg);shots.splice(i,1);continue;}
   s.x+=dx/dd*s.spd*dt;s.y+=dy/dd*s.spd*dt;
  }
 }
 fx.forEach(f=>{if(f.t!==undefined)f.t-=dt;if(f.slash!==undefined)f.slash-=dt;
  if(f.vx)f.x+=f.vx*dt;if(f.vy)f.y+=f.vy*dt;if(f.grav)f.vy+=f.grav*dt;});
 fx=fx.filter(f=>(f.t===undefined?1:f.t)>0&&(f.slash===undefined||f.slash>0));
 renderHUD();
}
function hit(t,dmg){
 t.hp-=dmg;t.flash=.15;
 fx.push({num:Math.round(dmg),x:t.x+(Math.random()-.5)*16,y:t.y-22,t:.6,vy:-46,c:'#ffe'});
 if(t.hp<=0&&t.isTower){
  crowns[t.side==='p'?'e':'p']++;
  boomFx(t.x,t.y,40);
  fx.push({ring:.7,x:t.x,y:t.y,t:.7,c:'255,215,0',big:true});
  shakeT=.28;shakeMag=3.6;
  const ks=towers.find(q=>q.side===t.side&&q.king);
  if(t.king){endGame(t.side==='p'?'e':'p');}
  else if(ks&&ks.hp>0){ks.rng=160;ks.dmg=100;}
 }
}
function boom(x,y,r,side,dmg){
 boomFx(x,y,r/2);
 fx.push({ring:.5,x,y,t:.5,c:'255,176,80',big:true});
 for(const u of units){if(u.side!==side&&Math.hypot(u.x-x,u.y-y)<r)u.hp-=dmg;}
 for(const t of towers){if(t.hp>0&&t.side!==side&&Math.hypot(t.x-x,t.y-y)<r+14)t.hp-=dmg*0.4;}
}
function boomFx(x,y,n){for(let i=0;i<n;i++)fx.push({x,y,t:.4+Math.random()*.3,c:Math.random()<.5?'#fa0':'#f55',vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160});}
function endGame(w){

 if(!w){
  if(crowns.p!==crowns.e)w=crowns.p>crowns.e?'p':'e';
  else{const hp=s=>towers.filter(t=>t.side===s).reduce((a,t)=>a+Math.max(0,t.hp),0);
   w=hp('p')===hp('e')?'':(hp('p')>hp('e')?'p':'e');}
 }
 winner=w;

}

/* ============================================================
 * 渲染 — polished fantasy battlefield
 * ============================================================ */
function drawTower(t){
 const now=performance.now()/1000;
 if(t.hp<=0){ // 废墟
  ctx.fillStyle='#2c2c34';roundRect(ctx,t.x-t.r*.8,t.y-t.r*.4,t.r*1.6,t.r*.9,4);ctx.fill();
  ctx.fillStyle='#1c1c22';
  ctx.fillRect(t.x-t.r*.8,t.y-t.r*.4,8,t.r*.5);ctx.fillRect(t.x+t.r*.8-8,t.y-t.r*.4,8,t.r*.5);
  ctx.fillRect(t.x-6,t.y-t.r*.2,12,8);
  ctx.font='18px serif';ctx.textAlign='center';ctx.fillText('🔥',t.x,t.y-6);
  return;
 }
 const pl=t.side==='p';
 const body=ctx.createLinearGradient(t.x-t.r,0,t.x+t.r,0);
 if(pl){body.addColorStop(0,'#8fa2b8');body.addColorStop(.5,'#d5dde6');body.addColorStop(1,'#7e93ab');}
 else{body.addColorStop(0,'#3c4152');body.addColorStop(.5,'#6a6f82');body.addColorStop(1,'#343949');}
 ctx.fillStyle=body;
 roundRect(ctx,t.x-t.r,t.y-t.r,t.r*2,t.r*1.5,5);ctx.fill();
 // stone courses
 ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1.2;
 for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(t.x-t.r+3,t.y-t.r+i*t.r*1.5/4);ctx.lineTo(t.x+t.r-3,t.y-t.r+i*t.r*1.5/4);ctx.stroke();}
 // roof / battlement
 if(!pl){ // enemy conical roof
  const rg=ctx.createLinearGradient(t.x-t.r,0,t.x+t.r,0);
  rg.addColorStop(0,'#3a2440');rg.addColorStop(.5,'#5c3a66');rg.addColorStop(1,'#33203a');
  ctx.fillStyle=rg;
  ctx.beginPath();ctx.moveTo(t.x-t.r-3,t.y-t.r+2);ctx.lineTo(t.x,t.y-t.r-(t.king?30:22));ctx.lineTo(t.x+t.r+3,t.y-t.r+2);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(t.x,t.y-t.r-(t.king?30:22),2.4,0,7);ctx.fill();
 }else{ // player crenellated top
  ctx.fillStyle='#c3cdd8';
  for(let i=0;i<4;i++)ctx.fillRect(t.x-t.r+i*(t.r*2/4)+2,t.y-t.r-7,t.r*2/4-4,8);
 }
 // banner (waving)
 const bx=t.x+(pl?-1:1)*(t.r*.55);
 ctx.strokeStyle='#57493a';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(bx,t.y-t.r*(pl?1.15:1.5));ctx.lineTo(bx,t.y-t.r*(pl?.45:.9));ctx.stroke();
 const fw=15,fh=9,fy=t.y-t.r*(pl?1.12:1.46),wv=Math.sin(now*3+(pl?0:2))*2;
 ctx.fillStyle=pl?'#3d6db5':'#8a3030';
 ctx.beginPath();ctx.moveTo(bx,fy);ctx.lineTo(bx+fw,fy+2+wv);ctx.lineTo(bx+fw,fy+fh+2+wv);ctx.lineTo(bx,fy+fh);ctx.closePath();ctx.fill();
 // emblem
 ctx.textAlign='center';
 if(t.king){
  ctx.font='16px serif';ctx.fillText('👑',t.x,t.y+4);
 }else{
  ctx.strokeStyle=pl?'#2e5f9e':'#8a3030';ctx.lineWidth=2.4;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(t.x-4,t.y,5,Math.PI*.5,Math.PI*1.5);ctx.stroke();
  ctx.beginPath();ctx.arc(t.x+4,t.y,5,-Math.PI*.5,Math.PI*.5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(t.x-9,t.y);ctx.lineTo(t.x+9,t.y);ctx.stroke();
 }
 if(t.flash>0){ctx.fillStyle='#ffffff88';roundRect(ctx,t.x-t.r,t.y-t.r,t.r*2,t.r*1.6,5);ctx.fill();}
 if(t.king&&t.rng>150){ // enraged aura
  const a=.25+.15*Math.sin(now*6);
  const g=ctx.createRadialGradient(t.x,t.y,4,t.x,t.y,t.r*2.2);
  g.addColorStop(0,'rgba(255,80,50,'+a+')');g.addColorStop(1,'rgba(255,80,50,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(t.x,t.y,t.r*2.2,0,7);ctx.fill();
 }
 hpBar(t.x,t.y-t.r-16,t.r*2.1,t.hp/t.maxHp,pl?'#4f4':'#f66');
}
function drawUnit(u){
 const d=CARDS[u.k];
 let ox=0,oy=0;
 if(u.atk>0){const k=Math.sin((1-u.atk/.22)*Math.PI)*13;ox=(u.atkDx||0)*k;oy=(u.atkDy||0)*k;}
 let scale=1,glow=0;
 if(u.born<.45){const p=Math.max(0,u.born/.45);scale=.2+.8*(1-Math.pow(1-p,3))*(1+.14*Math.sin(p*Math.PI));}
 if(u.born<.6)glow=1-u.born/.6;
 const bob=Math.sin((u.born+(u.v||0)*.7)*3)*1.2;
 // Mirajane ward dome (building)
 if(d.type==='building'){
  ctx.save();
  const dg=ctx.createRadialGradient(u.x,u.y,10,u.x,u.y,46);
  dg.addColorStop(0,'rgba(200,176,255,.14)');dg.addColorStop(.8,'rgba(200,176,255,.10)');dg.addColorStop(1,'rgba(200,176,255,0)');
  ctx.fillStyle=dg;ctx.beginPath();ctx.arc(u.x,u.y,46,0,7);ctx.fill();
  ctx.strokeStyle='rgba(216,200,255,.55)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.arc(u.x,u.y,44,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(216,200,255,.25)';
  ctx.beginPath();ctx.arc(u.x,u.y,36,0,7);ctx.stroke();
  ctx.restore();
 }
 CRCHARS.drawFTUnit(ctx,u.k,u.x+ox,u.y+oy+bob,d.hp>500?46:38,u.side,{v:u.v,scale,glow});
 if(u.flash>0){ctx.fillStyle='#ffffff99';ctx.beginPath();ctx.arc(u.x+ox,u.y+oy,17,0,7);ctx.fill();}
 hpBar(u.x,u.y-24,30,u.hp/u.maxHp,u.side==='p'?'#4f4':'#f66');
}
function draw(dt){
 ctx.setTransform(VIEW_SCALE,0,0,VIEW_SCALE,0,0);
 ctx.clearRect(0,0,W,H);
 ctx.save();
 if(shakeT>0){const m=shakeMag*(shakeT/.28);ctx.translate((Math.random()-.5)*2*m,(Math.random()-.5)*2*m);shakeT-=1/60;}
 // terrain
 ctx.drawImage(bg,0,0,W,H);
 // 己方部署高亮
 if(started&&!over&&selCard&&CARDS[selCard].type!=='spell'){
  ctx.fillStyle='rgba(90,170,255,.12)';
  ctx.fillRect(0,RIVER_Y+RIVER_H/2+10,W,H-(RIVER_Y+RIVER_H/2+10));
  ctx.strokeStyle='rgba(160,210,255,.6)';ctx.lineWidth=2;ctx.setLineDash([10,8]);
  ctx.beginPath();ctx.moveTo(0,RIVER_Y+RIVER_H/2+10);ctx.lineTo(W,RIVER_Y+RIVER_H/2+10);ctx.stroke();
  ctx.setLineDash([]);
 }
 // river waves + bridges
 ctx.fillStyle='rgba(190,224,255,.35)';
 for(let x=0;x<W;x+=26)ctx.fillRect(x+((performance.now()/900)%1)*26-26,RIVER_Y-4,14,3);
 CRTHEMES.drawBridges(ctx);
 // 塔
 towers.forEach(drawTower);
 // summon circles UNDER units
 const now=performance.now()/1000;
 fx.forEach(f=>{
  if(f.circle!==undefined){
   const p=1-f.t/.6;
   CRCHARS.drawMagicCircle(ctx,f.x,f.y,(f.big?46:34)*(0.6+0.4*p),p,f.c,now*(f.big?2.2:1.6));
  }
 });
 // 单位
 units.forEach(drawUnit);
 // 抛射物
 shots.forEach(s=>{
  if(s.spell){
   ctx.strokeStyle='#ffb05088';ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(s.tx,s.ty,s.radius*(0.92+0.08*Math.sin(now*6)),0,7);ctx.stroke();
   ctx.strokeStyle='#ffd89055';ctx.beginPath();ctx.arc(s.tx,s.ty,6,0,7);ctx.stroke();
   ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.sin(now*8)*.18);
   CRCHARS.flameHead(ctx,1.15);ctx.restore();return;}
  const ang=Math.atan2((s.tgt?s.tgt.y:s.ty)-s.y,(s.tgt?s.tgt.x:s.tx)-s.x);
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(ang);
  if(s.kind==='ball'){ // Mirajane soul orb
   const g=ctx.createRadialGradient(-1,-1,1,0,0,8);
   g.addColorStop(0,'#f2eaff');g.addColorStop(.5,'#c8a8f8');g.addColorStop(1,'#7a4fc0');
   ctx.fillStyle='#c8a8f844';ctx.beginPath();ctx.arc(-9,0,6,0,7);ctx.fill();
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,6.5,0,7);ctx.fill();
   ctx.strokeStyle='#e8dcff';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,0,6.5,.6,2.4);ctx.stroke();
  }else if(s.kind==='bullet'){ // Juvia water bolt
   ctx.strokeStyle='#9fd8ff';ctx.lineWidth=4;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(4,0);ctx.stroke();
   ctx.fillStyle='#e8f6ff';ctx.beginPath();ctx.ellipse(6,0,4.4,2.8,0,0,7);ctx.fill();
   ctx.fillStyle='#7fd0ff88';ctx.beginPath();ctx.arc(-16,0,2.4,0,7);ctx.fill();
  }else{ // celestial arrows (Lucy/Wendy/towers)
   const gold=s.side==='p';
   ctx.strokeStyle=gold?'#ffe9a0':'#ffd0b8';ctx.lineWidth=2.6;
   ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(6,0);ctx.stroke();
   ctx.fillStyle=gold?'#fff6d8':'#ffe4d4';
   ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(3,-3.2);ctx.lineTo(3,3.2);ctx.fill();
   if(!gold){ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-15,-2.5);ctx.lineTo(-15,2.5);ctx.fill();}
  }
  ctx.restore();
 });
 // 特效
 fx.forEach(f=>{
  if(f.circle!==undefined)return; // drawn earlier
  if(f.ring!==undefined){
   const p=1-f.t/(f.big?.7:.5);
   ctx.strokeStyle='rgba('+f.c+','+Math.max(0,1-p)+')';ctx.lineWidth=f.big?3.5:2.5;
   ctx.beginPath();ctx.arc(f.x,f.y,(f.big?10:6)+p*(f.big?48:32),0,7);ctx.stroke();
  }else if(f.beam!==undefined){ // vertical light burst
   const p=1-f.t/.45;
   const g=ctx.createLinearGradient(f.x,f.y-60*(1-p*.4),f.x,f.y+18);
   g.addColorStop(0,'rgba('+f.c+',0)');
   g.addColorStop(.7,'rgba('+f.c+','+(.5*(1-p))+')');
   g.addColorStop(1,'rgba(255,255,255,'+(.5*(1-p))+')');
   ctx.fillStyle=g;
   ctx.beginPath();ctx.moveTo(f.x-16*(1-p),f.y+16);ctx.lineTo(f.x-4,f.y-60*(1-p*.4));
   ctx.lineTo(f.x+4,f.y-60*(1-p*.4));ctx.lineTo(f.x+16*(1-p),f.y+16);ctx.closePath();ctx.fill();
  }else if(f.slash!==undefined){
   const p=1-f.slash/.18;
   ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);
   ctx.strokeStyle=f.c;ctx.globalAlpha=1-p;ctx.lineWidth=4;
   ctx.beginPath();ctx.arc(0,0,13+p*11,-1,1);ctx.stroke();ctx.restore();ctx.globalAlpha=1;
  }else if(f.num){
   ctx.globalAlpha=Math.min(1,f.t*2.5);ctx.fillStyle=f.c;
   ctx.font='bold 13px sans-serif';ctx.fillText(f.num,f.x,f.y);ctx.globalAlpha=1;
  }else{
   ctx.fillStyle=f.c;ctx.globalAlpha=Math.min(1,f.t*3);ctx.fillRect(f.x-3,f.y-3,6,6);ctx.globalAlpha=1;
  }
 });
 // 环境粒子(落叶/花瓣/雪/蝴蝶)— freeze while paused, drift otherwise
 if(!paused)ambient.step(dt,performance.now()/1000,ctx);
 // 暗角(per theme)
 if(!vignette){
  const P=CRTHEMES.PAL[theme]||CRTHEMES.PAL.summer;
  vignette=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.64);
  vignette.addColorStop(0,P.vignette[0]);vignette.addColorStop(1,P.vignette[1]);
 }
 ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
 // 主题切换柔和过渡
 if(themeFade<1){
  themeFade=Math.min(1,themeFade+dt*2.2);
  const a=(1-themeFade);
  ctx.fillStyle='rgba(255,252,240,'+(a*.82)+')';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,215,0,'+(a*.5)+')';ctx.lineWidth=8*a+2;
  ctx.beginPath();ctx.arc(W/2,H/2,(1-a)*560+40,0,7);ctx.stroke();
 }
 // 开始/结束遮罩
 if(!started||over){
  ctx.textAlign='center';
  if(!started){
   ctx.fillStyle='rgba(6,10,20,.5)';ctx.fillRect(0,H/2-70,W,150);
   ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';
   ctx.fillText(T('tapStart'),W/2,H/2-12);
   ctx.fillStyle='#9fd0ff';ctx.font='13px sans-serif';
   ctx.fillText('FAIRY TAIL EDITION',W/2,H/2+20);
  }else{
   const win=winner==='p',draw2=winner==='';
   // poster backdrop (title + buttons live in the HTML end panel)
   if(IMG_CLASH.width){
    const ar=IMG_CLASH.width/IMG_CLASH.height;
    let dw=H*ar,dh=H;if(dw<W){dw=W;dh=W/ar;}
    ctx.save();ctx.globalAlpha=win?.5:(draw2?.3:.22);
    if(!win&&!draw2)ctx.filter='grayscale(.7) brightness(.6)';
    ctx.drawImage(IMG_CLASH,(W-dw)/2,(H-dh)/2,dw,dh);
    ctx.restore();ctx.filter='none';
   }
   ctx.fillStyle='rgba(5,8,18,.42)';ctx.fillRect(0,0,W,H);
  }
 }
 ctx.restore();
}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw(dt);requestAnimationFrame(loop);}

/* ===== canvas sizing: battlefield fills the viewport, bitmap matches display ===== */
let VIEW_SCALE=1;
function fitCanvas(){
 const wrap=document.getElementById('cvwrap');
 const aw=wrap.clientWidth-8,ah=wrap.clientHeight-8;
 const ar=W/H;
 let w=aw,h=w/ar;
 if(h>ah){h=ah;w=h*ar;}
 cv.style.width=Math.round(w)+'px';
 cv.style.height=Math.round(h)+'px';
 const dpr=Math.min(2,window.devicePixelRatio||1);
 cv.width=Math.max(1,Math.round(w*dpr));
 cv.height=Math.max(1,Math.round(h*dpr));
 VIEW_SCALE=cv.width/W;
 vignette=null; // gradient was tied to old transform size
}

/* ============================================================
 * Boot: preload portraits -> build world -> loading overlay
 * ============================================================ */
CRCHARS.preloadPortraits(()=>{
 buildTerrain();
 reset();renderHand();fitCanvas();
 requestAnimationFrame(loop);
});
addEventListener('resize',fitCanvas);

/* ===== loading screen (dramatic poster + rotating tips) ===== */
(function(){
 const overlay=document.getElementById('loading'),fill=document.getElementById('ldFill'),
       pct=document.getElementById('ldPct'),tipEl=document.getElementById('ldTip'),
       tipText=document.getElementById('ldTipText'),tipIcon=document.getElementById('ldTipIcon');
 let tipIdx=0;
 const tips0=CRI18N.t('tips');
 tipIcon.textContent=tips0[0].ic;tipText.textContent=tips0[0].t;
 const tipTimer=setInterval(()=>{
  tipEl.classList.add('fade');
  setTimeout(()=>{
   const tips=CRI18N.t('tips');
   tipIdx=(tipIdx+1)%tips.length;
   tipIcon.textContent=tips[tipIdx].ic;tipText.textContent=tips[tipIdx].t;
   tipEl.classList.remove('fade');
  },300);
 },2300);
 const DUR=3400,t0=performance.now();let doneFlag=false;
 function finish(){
  if(doneFlag)return;doneFlag=true;
  clearInterval(tipTimer);
  fill.style.width='100%';pct.textContent='100%';
  setTimeout(()=>{overlay.classList.add('done');setTimeout(()=>overlay.style.display='none',600);},200);
 }
 (function prog(){
  const p=Math.min(1,(performance.now()-t0)/DUR);
  fill.style.width=(p*100).toFixed(1)+'%';
  pct.textContent=Math.round(p*100)+'%';
  if(p<1&&!doneFlag)requestAnimationFrame(prog);else finish();
 })();
 overlay.addEventListener('pointerdown',finish);
 document.getElementById('ldSkip').addEventListener('pointerdown',finish);
})();

/* ===== guidance modal + language ===== */
const gmodal=document.getElementById('gmodal');
function buildModal(){document.getElementById('gbody').innerHTML=CRGUID.build();}
document.getElementById('btnGuide').onclick=()=>{buildModal();gmodal.classList.add('open');paused=true;};
document.getElementById('gclose').onclick=()=>{gmodal.classList.remove('open');paused=false;};
gmodal.addEventListener('pointerdown',e=>{if(e.target===gmodal){gmodal.classList.remove('open');paused=false;}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&gmodal.classList.contains('open')){gmodal.classList.remove('open');paused=false;}});

document.getElementById('btnLang').onclick=()=>CRI18N.toggle();
document.getElementById('btnHome').onclick=()=>{location.href='index.html';};
document.getElementById('btnTheme').onclick=()=>CRTHEMES.openModal();

/* theme switching: rebuild terrain behind a soft light transition */
function applyThemeUI(){
 theme=CRTHEMES.get();
 buildTerrain();
 ambient=CRTHEMES.makeAmbient(theme);
 themeFade=0; // triggers the fade-in overlay in draw()
 document.getElementById('themeIco').textContent=(CRTHEMES.PAL[theme]||{}).icon||'☀️';
}
addEventListener('crtheme',applyThemeUI);
document.getElementById('themeIco').textContent=(CRTHEMES.PAL[theme]||{}).icon||'☀️';
/* battle pauses while the theme picker is open */
addEventListener('crthemeui',e=>{
 if(!e.detail)return;
 if(e.detail.open)paused=true;
 else if(!gmodal.classList.contains('open'))paused=false;
});

function refreshLangUI(){
 document.getElementById('langLabel').textContent=CRI18N.lang()==='en'?'中文':'English';
 if(!started)say(T('hint'));
 if(over)say(winner==='p'?T('winMsg'):winner==='e'?T('loseMsg'):T('drawMsg'));
 handKey='';renderHand();
 if(gmodal.classList.contains('open'))buildModal();
 if(endscr.classList.contains('show'))showEnd();
 document.title=CRI18N.lang()==='zh'?'Clash Royal · 妖精的尾巴竞技场':'Clash Royal · Fairy Tail Arena';
}
addEventListener('crlang',refreshLangUI);
CRI18N.apply();
refreshLangUI();
